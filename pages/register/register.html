<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register - Ellaria</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <main class="main-content">
    <div class="section-container auth-card">
      <h1>Daftar</h1>
      <form id="register-form">
        <label>Nama Lengkap<input type="text" name="displayName" required></label>
        <label>Email<input type="email" name="email" required></label>
        <label>Password<input type="password" name="password" required></label>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
          <button class="btn" type="submit">Daftar</button>
          <a class="btn btn-secondary" href="/pages/login/login.html">Masuk</a>
        </div>
      </form>
      <p class="muted" style="margin-top:12px">Catatan: Ini adalah stub. Ganti dengan Firebase/NextAuth untuk produksi.</p>
    </div>
  </main>
  <script src="/js/storageService.js" defer></script>
  <script src="/js/authService.js" defer></script>
  <script src="register.js" defer></script>
</body>
</html>
