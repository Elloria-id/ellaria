<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login - Ellaria エル">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/animation.css">
    <link rel="stylesheet" href="auth.css">
    <title>Masuk - Ellaria エル</title>
</head>
<body>
    <div class="background-aurora">
        <div class="aurora-light"></div>
        <div class="stars"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card animate-slideUp">
            <div class="auth-header">
                <h1>Ellaria<span class="jp">エル</span></h1>
                <p>Masuk ke akun Anda</p>
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required class="form-input">
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="login-password" name="password" required class="form-input">
                        <button type="button" class="toggle-password" id="toggle-password">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <span class="error-message" id="password-error"></span>
                </div>

                <div class="form-group checkbox">
                    <label>
                        <input type="checkbox" id="remember-me" name="remember">
                        Ingat saya
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">Masuk</button>
                <span class="error-message" id="form-error"></span>
            </form>

            <div class="auth-divider">atau</div>

            <div class="social-login">
                <button type="button" class="social-btn google" id="google-login">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google
                </button>
                <button type="button" class="social-btn discord" id="discord-login">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.317 4.368c-1.578-.69-3.282-1.206-5.074-1.539a.02.02 0 0 0-.021.01c-.291.502-.612 1.162-.837 1.684-.744-.111-1.476-.111-2.204 0-.225-.522-.556-1.182-.839-1.684a.021.021 0 0 0-.02-.009c-1.792.333-3.497.849-5.075 1.54a.019.019 0 0 0-.009.02c.331 4.945 2.241 9.75 5.25 13.005a.02.02 0 0 0 .02.001c.577-.467 1.12-.967 1.614-1.5a.02.02 0 0 0-.01-.035c-.812-.245-1.584-.561-2.313-.943a.02.02 0 0 1-.002-.033c.155-.12.31-.243.459-.364a.02.02 0 0 1 .021-.002c4.667 2.172 9.75 2.172 14.38 0a.02.02 0 0 1 .021.002c.149.121.304.244.459.364a.02.02 0 0 1-.002.033c-.73.382-1.501.698-2.313.943a.02.02 0 0 0-.01.035c.494.533 1.037 1.033 1.614 1.5a.02.02 0 0 0 .021-.001c3.01-3.255 4.92-8.06 5.25-13.005a.019.019 0 0 0-.009-.019z"/>
                    </svg>
                    Discord
                </button>
            </div>

            <div class="auth-footer">
                <p>Belum punya akun? <a href="/pages/register/register.html">Daftar di sini</a></p>
                <a href="#" class="forgot-password">Lupa password?</a>
            </div>
        </div>
    </div>

    <script src="/js/main.js" defer></script>
    <script src="auth.js" defer></script>
</body>
</html>
