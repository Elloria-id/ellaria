<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - Ellaria</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="main-content">
    <div class="section-container auth-card">
      <h1>Masuk</h1>
      <form id="login-form">
        <label>Email<input type="email" name="email" required></label>
        <label>Password<input type="password" name="password" required></label>
        <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
          <button class="btn" type="submit">Masuk</button>
          <a class="btn btn-secondary" href="/pages/register/register.html">Daftar</a>
        </div>
      </form>

      <div style="margin-top:16px">
        <p class="muted">Atau masuk menggunakan:</p>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn" id="google-login">Google</button>
          <button class="btn" id="discord-login">Discord</button>
        </div>
      </div>

      <p class="muted" style="margin-top:12px">Catatan: Ini adalah stub. Ganti dengan Firebase/NextAuth untuk produksi.</p>
    </div>
  </main>

  <script src="/js/storageService.js" defer></script>
  <script src="/js/authService.js" defer></script>
  <script src="login.js" defer></script>
</body>
</html>
