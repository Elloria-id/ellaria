<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wallet - Ellaria</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="wallet.css">
</head>
<body>
  <div class="background-aurora"><div class="aurora-light"></div><div class="stars"></div></div>
  <main class="main-content">
    <div class="section-container">
      <h1>Wallet</h1>
      <div class="wallet-panel">
        <div class="wallet-balance">Saldo: <strong id="wallet-balance">Rp 0</strong></div>
        <div class="wallet-actions">
          <button class="btn" id="topup-btn">Top Up</button>
          <button class="btn btn-secondary" id="withdraw-btn">Tarik</button>
        </div>
        <div class="wallet-transactions" id="wallet-transactions"></div>
      </div>
    </div>
  </main>
  <script src="wallet.js" defer></script>
</body>
</html>
