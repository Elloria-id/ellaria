<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Jelajahi koleksi manga, manhwa, manhua, dan novel terlengkap">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="explore.css">
    <title>Jelajahi - Ellaria エル</title>
</head>
<body>
    <div class="background-aurora">
        <div class="aurora-light"></div>
        <div class="stars"></div>
    </div>

    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <a href="/" class="logo-link">
                    <span class="logo-text">Ellaria</span>
                    <span class="logo-jp">エル</span>
                </a>
            </div>
            <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
            <div class="navbar-menu" id="navbar-menu">
                <ul class="navbar-list">
                    <li><a href="/" class="navbar-link">Beranda</a></li>
                    <li><a href="/pages/explore/explore.html" class="navbar-link active">Jelajahi</a></li>
                    <li><a href="#" class="navbar-link">Genre</a></li>
                    <li><a href="/pages/community/community.html" class="navbar-link">Komunitas</a></li>
                    <li><a href="/pages/shop/shop.html" class="navbar-link">Toko</a></li>
                </ul>
            </div>
            <div class="navbar-actions">
                <button class="search-btn" id="search-btn" aria-label="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <button class="notification-btn" id="notification-btn" aria-label="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>
                <div class="profile-menu" id="profile-menu">
                    <button class="profile-btn" id="profile-btn" aria-label="Profile">
                        <img id="profile-avatar" src="/assets/images/avatar/default.jpg" alt="Profile" class="profile-avatar">
                    </button>
                    <div class="profile-dropdown" id="profile-dropdown" style="display:none;">
                        <a href="/pages/profile/profile.html" class="dropdown-item">Profil</a>
                        <a href="/pages/bookmark/bookmark.html" class="dropdown-item">Bookmark</a>
                        <a href="/pages/history/history.html" class="dropdown-item">Riwayat</a>
                        <hr>
                        <a href="/pages/login/login.html" id="login-link" class="dropdown-item">Masuk</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="section-container">
            <div class="explore-header">
                <h1 class="section-title">Jelajahi Koleksi</h1>
                <p class="explore-subtitle">Temukan manga, manhwa, manhua, dan novel favorit Anda</p>
            </div>

            <!-- Search & Filter -->
            <div class="explore-controls">
                <div class="search-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="explore-search" placeholder="Cari judul, penulis, atau genre..." class="explore-search-input">
                </div>

                <div class="filter-controls">
                    <select id="genre-filter" class="filter-select">
                        <option value="">Semua Genre</option>
                        <option value="action">Action</option>
                        <option value="fantasy">Fantasy</option>
                        <option value="comedy">Comedy</option>
                        <option value="drama">Drama</option>
                        <option value="romance">Romance</option>
                    </select>

                    <select id="status-filter" class="filter-select">
                        <option value="">Semua Status</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="completed">Completed</option>
                    </select>

                    <select id="sort-filter" class="filter-select">
                        <option value="latest">Terbaru</option>
                        <option value="popular">Populer</option>
                        <option value="trending">Trending</option>
                        <option value="rating">Rating Tinggi</option>
                    </select>
                </div>
            </div>

            <!-- Series Grid -->
            <div class="explore-grid" id="explore-grid">
                <div class="card-skeleton"><div class="skeleton-cover"></div><div class="skeleton-text"></div></div>
                <div class="card-skeleton"><div class="skeleton-cover"></div><div class="skeleton-text"></div></div>
                <div class="card-skeleton"><div class="skeleton-cover"></div><div class="skeleton-text"></div></div>
                <div class="card-skeleton"><div class="skeleton-cover"></div><div class="skeleton-text"></div></div>
            </div>

            <!-- No Results -->
            <div class="no-results" id="no-results" style="display:none;">
                <div class="no-results-icon">📚</div>
                <h3>Seri tidak ditemukan</h3>
                <p>Coba ubah filter atau cari dengan kata kunci lain</p>
            </div>
        </div>
    </main>

    <script src="/js/main.js" defer></script>
    <script src="/js/navbar.js" defer></script>
    <script src="explore.js" defer></script>
</body>
</html>
