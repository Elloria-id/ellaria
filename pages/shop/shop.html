<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shop - Ellaria</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="shop.css">
</head>
<body>
  <main class="main-content">
    <div class="section-container">
      <h1>Toko</h1>
      <p class="muted">Beli koin, paket VIP, atau barang fisik. Semua transaksi disimulasikan di client (TODO: implement server-side payments).</p>
      <div class="shop-grid" id="shop-grid"></div>
    </div>
  </main>

  <!-- Checkout modal -->
  <div id="checkout-modal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>Checkout</h3>
      <div id="checkout-body"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button class="btn" id="checkout-confirm">Simulate success</button>
        <button class="btn btn-secondary" id="checkout-cancel">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/js/storageService.js" defer></script>
  <script src="/js/authService.js" defer></script>
  <script src="shop.js" defer></script>
</body>
</html>
