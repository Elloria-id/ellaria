<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Profile - Ellaria エル">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/reset.css">
    <link rel="stylesheet" href="/css/global.css">
    <link rel="stylesheet" href="/css/navbar.css">
    <link rel="stylesheet" href="/css/responsive.css">
    <link rel="stylesheet" href="profile.css">
    <title>Profil - Ellaria エル</title>
</head>
<body>
    <div class="background-aurora">
        <div class="aurora-light"></div>
        <div class="stars"></div>
    </div>

    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <a href="/" class="logo-link">
                    <span class="logo-text">Ellaria</span>
                    <span class="logo-jp">エル</span>
                </a>
            </div>
            <button class="menu-toggle" id="menu-toggle">
                <span></span><span></span><span></span>
            </button>
            <div class="navbar-menu" id="navbar-menu">
                <ul class="navbar-list">
                    <li><a href="/" class="navbar-link">Beranda</a></li>
                </ul>
            </div>
            <div class="navbar-actions">
                <button id="logout-btn" class="btn btn-secondary">Keluar</button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="section-container">
            <!-- Profile Header -->
            <div class="profile-header">
                <div class="profile-cover"></div>
                <div class="profile-info">
                    <img id="profile-image" src="/assets/images/avatar/default.jpg" alt="Profile" class="profile-avatar-large">
                    <div class="profile-details">
                        <h1 id="profile-name">User Name</h1>
                        <p id="profile-bio">Bio belum diisi</p>
                        <div class="profile-stats">
                            <div class="stat">
                                <span class="stat-value" id="stat-reading">0</span>
                                <span class="stat-label">Sedang Dibaca</span>
                            </div>
                            <div class="stat">
                                <span class="stat-value" id="stat-completed">0</span>
                                <span class="stat-label">Selesai</span>
                            </div>
                            <div class="stat">
                                <span class="stat-value" id="stat-bookmarks">0</span>
                                <span class="stat-label">Bookmark</span>
                            </div>
                        </div>
                    </div>
                    <button id="edit-profile-btn" class="btn">Edit Profil</button>
                </div>
            </div>

            <!-- Profile Tabs -->
            <div class="profile-tabs">
                <button class="tab active" data-tab="about">Tentang</button>
                <button class="tab" data-tab="activity">Aktivitas</button>
                <button class="tab" data-tab="settings">Pengaturan</button>
            </div>

            <!-- Tab Content -->
            <div class="tab-content">
                <div id="about-tab" class="tab-pane active">
                    <div class="info-group">
                        <label>Email</label>
                        <p id="profile-email">user@example.com</p>
                    </div>
                    <div class="info-group">
                        <label>Member Sejak</label>
                        <p id="profile-joined">1 Januari 2024</p>
                    </div>
                </div>

                <div id="activity-tab" class="tab-pane">
                    <div id="activity-list"></div>
                </div>

                <div id="settings-tab" class="tab-pane">
                    <div class="setting-group">
                        <label>
                            <input type="checkbox" id="notifications-setting" checked>
                            Aktifkan Notifikasi
                        </label>
                    </div>
                    <div class="setting-group">
                        <label>
                            <input type="checkbox" id="private-setting">
                            Profil Pribadi
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Edit Profile Modal -->
    <div class="modal" id="edit-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Profil</h2>
                <button class="close-btn" id="close-modal">×</button>
            </div>
            <form id="edit-form" class="modal-form">
                <div class="form-group">
                    <label>Nama Pengguna</label>
                    <input type="text" id="edit-name" class="form-input">
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="edit-bio" class="form-textarea"></textarea>
                </div>
                <button type="submit" class="btn">Simpan Perubahan</button>
            </form>
        </div>
    </div>

    <script src="/js/main.js" defer></script>
    <script src="/js/navbar.js" defer></script>
    <script src="profile.js" defer></script>
</body>
</html>
