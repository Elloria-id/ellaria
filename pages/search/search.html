<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - Ellaria</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/global.css">
  <link rel="stylesheet" href="search.css">
</head>
<body>
  <div class="background-aurora"><div class="aurora-light"></div><div class="stars"></div></div>
  <nav class="navbar" id="navbar"> <!-- navbar markup reused -->
    <div class="navbar-container">
      <div class="navbar-logo"><a href="/" class="logo-link"><span class="logo-text">Ellaria</span><span class="logo-jp">エル</span></a></div>
    </div>
  </nav>

  <main class="main-content">
    <div class="section-container">
      <div class="search-header">
        <h1>Cari Series</h1>
        <div class="search-row">
          <div class="search-box">
            <input type="text" id="search-query" placeholder="Cari judul, penulis, atau translator..." class="search-input">
            <button id="voice-search" class="btn" title="Voice search">🎤</button>
            <button id="search-btn" class="btn">Cari</button>
          </div>
          <div class="search-filters" id="search-filters">
            <select id="filter-genre" multiple size="3"></select>
            <select id="filter-type" multiple size="3"></select>
            <select id="filter-status" multiple size="3"></select>
            <input id="filter-author" placeholder="Author" class="filter-input">
            <input id="filter-year" placeholder="Year" class="filter-input">
            <select id="sort-by"><option value="relevance">Relevance</option><option value="newest">Newest</option><option value="popular">Popular</option><option value="alphabet">Alphabet</option></select>
          </div>
        </div>
      </div>

      <section class="trending-searches" id="trending-searches">
        <h3>Trending Search</h3>
        <div id="trending-tags" class="tags"></div>
      </section>

      <section class="search-results" id="search-results">
        <h3>Hasil Pencarian</h3>
        <div id="results-grid" class="results-grid"></div>
        <div id="results-pager" class="results-pager"><button id="load-more-results" class="btn">Muat Lebih</button></div>
      </section>
    </div>
  </main>

  <script src="/js/searchService.js" defer></script>
  <script src="/js/storageService.js" defer></script>
  <script src="search.js" defer></script>
</body>
</html>
